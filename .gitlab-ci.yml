stages:
  - verify
  - build
  - strip
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_GENERATOR: Ninja

# Verify that release tag matches Debian package version
verify:debian_tag_version:
  stage: verify
  image: debian:trixie
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update
    - apt-get install -y dpkg-dev
  script:
    - |
      set -eu

      TAG_VERSION="${CI_COMMIT_TAG#v}"
      DEB_VERSION="$(dpkg-parsechangelog -S Version)"
      DEB_UPSTREAM_VERSION="${DEB_VERSION%-*}"

      echo "Tag version:      ${TAG_VERSION}"
      echo "Debian version:   ${DEB_VERSION}"
      echo "Upstream version: ${DEB_UPSTREAM_VERSION}"

      if [ "${DEB_VERSION}" != "${TAG_VERSION}" ] && [ "${DEB_UPSTREAM_VERSION}" != "${TAG_VERSION}" ]; then
        echo "ERROR: Git tag '${CI_COMMIT_TAG}' does not match Debian package version '${DEB_VERSION}'."
        echo "Expected tag version '${TAG_VERSION}' to equal either the full Debian version"
        echo "or its upstream part before the Debian revision."
        exit 1
      fi

.build_template:
  stage: build
  artifacts:
    paths:
      - build/luxon_server.*
    expire_in: 1 week

.build_deb_template:
  stage: build
  image: "debian:${DEBIAN_SUITE}"
  artifacts:
    paths:
      - debian-packages/
    expire_in: 1 week

# Debian package builds for several suites and archs
build:deb:
  extends: .build_deb_template
  parallel:
    matrix:
      - DEBIAN_SUITE: [trixie, unstable]
        DEB_TARGET_ARCH: [amd64, arm64, i386, riscv64, ppc64el, s390x]
  before_script:
    - |
      set -eu

      HOST_ARCH="$(dpkg --print-architecture)"

      if [ "${DEB_TARGET_ARCH}" != "${HOST_ARCH}" ]; then
        dpkg --add-architecture "${DEB_TARGET_ARCH}"
      fi

      apt-get update
      apt-get install -y dpkg-dev debhelper cmake ninja-build git

      if [ "${DEB_TARGET_ARCH}" = "${HOST_ARCH}" ]; then
        apt-get install -y build-essential libmbedtls-dev libspdlog-dev
      else
        apt-get install -y \
          "crossbuild-essential-${DEB_TARGET_ARCH}" \
          "libmbedtls-dev:${DEB_TARGET_ARCH}" \
          "libspdlog-dev:${DEB_TARGET_ARCH}"
      fi
  script:
    - |
      set -eu

      HOST_ARCH="$(dpkg --print-architecture)"
      OUTDIR="debian-packages/${DEBIAN_SUITE}/${DEB_TARGET_ARCH}"
      mkdir -p "${OUTDIR}"

      sed -i "1 s/UNRELEASED/${DEBIAN_SUITE}/" debian/changelog

      if [ "${DEB_TARGET_ARCH}" = "${HOST_ARCH}" ]; then
        dpkg-buildpackage -us -uc -b
      else
        dpkg-buildpackage -a"${DEB_TARGET_ARCH}" -us -uc -b
      fi

      mv ../*.deb "${OUTDIR}/"
      mv ../*.buildinfo "${OUTDIR}/"
      mv ../*.changes "${OUTDIR}/"

# RelWithDebInfo static build amd64 via alpine
build:alpine:amd64:
  extends: .build_template
  image: alpine:3
  before_script:
    - apk update && apk add build-base cmake ninja git linux-headers
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static"
    - cmake --build build
    - mv build/luxon_server build/luxon_server.musl-static.rel+debinfo.linux-x86_64

# RelWithDebInfo static build i686 via Alpine
build:alpine:i686:
  extends: .build_template
  image: i386/alpine:3
  before_script:
    - apk update && apk add build-base cmake ninja git linux-headers
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static" -DLUXON_SERVER_USE_SANMAKE=OFF
    - cmake --build build
    - mv build/luxon_server build/luxon_server.musl-static.rel+debinfo.linux-i686

# RelWithDebInfo static build armhf via Debian Trixie + Bootlin uclibc Toolchain
build:bootlin:armhf:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y build-essential cmake ninja-build git wget xz-utils
    - wget -q https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--uclibc--stable-2025.08-1.tar.xz
    - mkdir -p /opt/toolchain
    - tar -xf armv7-eabihf--uclibc--stable-2025.08-1.tar.xz -C /opt/toolchain --strip-components=1
  script:
    - export PATH=/opt/toolchain/bin:$PATH
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=Linux
      -DCMAKE_SYSTEM_PROCESSOR=armv7
      -DCMAKE_C_COMPILER=arm-buildroot-linux-uclibcgnueabihf-gcc
      -DCMAKE_CXX_COMPILER=arm-buildroot-linux-uclibcgnueabihf-g++
      -DCMAKE_C_FLAGS="-gno-variable-location-views"
      -DCMAKE_CXX_FLAGS="-gno-variable-location-views"
      -DCMAKE_EXE_LINKER_FLAGS="-static"
      -DLUXON_SERVER_USE_SANMAKE=OFF
      -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    - cmake --build build
    - mv build/luxon_server build/luxon_server.uclibc-static.rel+debinfo.linux-armhf

# RelWithDebInfo build amd64 via llvm-mingw
build:mingw:amd64:
  extends: .build_template
  image: mstorsjo/llvm-mingw:latest
  before_script:
    - apt-get update && apt-get install -y cmake ninja-build git
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++ -DCMAKE_EXE_LINKER_FLAGS="-static"
    - cmake --build build
    - mv build/luxon_server.exe build/luxon_server.mingw.rel+debinfo.exe

# RelWithDebInfo build Nintendo 3DS via devkitpro
build:nintendo_3ds:
  extends: .build_template
  image: devkitpro/devkitarm:latest
  script:
    - source /etc/profile.d/devkit-env.sh
    - cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/3DS.cmake -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    - cmake --build build
    - 3dsxtool build/luxon_server.elf build/luxon_server.3dsx
    - mv build/luxon_server.elf build/luxon_server.devkitarm.rel+debinfo.elf
    - mv build/luxon_server.3dsx build/luxon_server.devkitarm.release.3dsx

# RelWithDebInfo build amd64 via Debian Trixie (FreeBSD 15.0 Sysroot)
build:freebsd:amd64:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y clang lld cmake ninja-build git wget xz-utils
    - wget https://download.freebsd.org/releases/amd64/15.0-RELEASE/base.txz
    - mkdir -p freebsd-sysroot
    - tar -xf base.txz -C freebsd-sysroot
  script:
    - export SYSROOT=$PWD/freebsd-sysroot
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=FreeBSD
      -DCMAKE_SYSTEM_PROCESSOR=amd64
      -DCMAKE_C_COMPILER=clang
      -DCMAKE_CXX_COMPILER=clang++
      -DCMAKE_C_FLAGS="--target=x86_64-unknown-freebsd15.0 --sysroot=$SYSROOT"
      -DCMAKE_CXX_FLAGS="--target=x86_64-unknown-freebsd15.0 --sysroot=$SYSROOT"
      -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld --target=x86_64-unknown-freebsd15.0 --sysroot=$SYSROOT"
    - cmake --build build
    - mv build/luxon_server build/luxon_server.libc.rel+debinfo.freebsd-x86_64

# RelWithDebInfo build amd64 via Debian Trixie (OpenBSD 7.8 Sysroot)
build:openbsd:amd64:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y clang lld cmake ninja-build git wget tar
    - mkdir -p openbsd-sysroot
    - wget https://public.tuxifan.net/tuxifan/OpenBSD/7.8/amd64/base78.tgz
    - wget https://public.tuxifan.net/tuxifan/OpenBSD/7.8/amd64/comp78.tgz
    - tar -xzf base78.tgz -C openbsd-sysroot
    - tar -xzf comp78.tgz -C openbsd-sysroot
  script:
    - export SYSROOT=$PWD/openbsd-sysroot
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=OpenBSD
      -DCMAKE_SYSTEM_PROCESSOR=amd64
      -DCMAKE_C_COMPILER=clang
      -DCMAKE_CXX_COMPILER=clang++
      -DCMAKE_C_FLAGS="--target=x86_64-unknown-openbsd7.8 --sysroot=$SYSROOT"
      -DCMAKE_CXX_FLAGS="--target=x86_64-unknown-openbsd7.8 --sysroot=$SYSROOT"
      -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld --target=x86_64-unknown-openbsd7.8 --sysroot=$SYSROOT"
    - cmake --build build
    - mv build/luxon_server build/luxon_server.libc.rel+debinfo.openbsd-x86_64

# RelWithDebInfo build aarch64 for macOS (Darwin) via Debian Trixie + macOS SDK
build:macos:aarch64:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y clang lld llvm cmake ninja-build git wget xz-utils
    - wget -q -O MacOSX.sdk.tar.xz "$MACOS_SDK_URL"
    - tar -xf MacOSX.sdk.tar.xz --warning=no-unknown-keyword
  script:
    - export SYSROOT=$PWD/MacOSX.sdk
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=Darwin
      -DCMAKE_SYSTEM_PROCESSOR=arm64
      -DCMAKE_C_COMPILER=clang
      -DCMAKE_CXX_COMPILER=clang++
      -DCMAKE_C_FLAGS="--target=arm64-apple-darwin"
      -DCMAKE_CXX_FLAGS="--target=arm64-apple-darwin"
      -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld"
      -DCMAKE_OSX_SYSROOT=$SYSROOT
      -DCMAKE_AR=/usr/bin/llvm-ar
      -DCMAKE_RANLIB=/usr/bin/llvm-ranlib
    - cmake --build build
    - mv build/luxon_server build/luxon_server.macosx-sdk.rel+debinfo.darwin-aarch64

# RelWithDebInfo build amd64 for macOS (Darwin) via Debian Trixie + macOS SDK
build:macos:amd64:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y clang lld llvm cmake ninja-build git wget xz-utils
    - wget -q -O MacOSX.sdk.tar.xz "$MACOS_SDK_URL"
    - tar -xf MacOSX.sdk.tar.xz --warning=no-unknown-keyword
  script:
    - export SYSROOT=$PWD/MacOSX.sdk
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=Darwin
      -DCMAKE_SYSTEM_PROCESSOR=x86_64
      -DCMAKE_C_COMPILER=clang
      -DCMAKE_CXX_COMPILER=clang++
      -DCMAKE_C_FLAGS="--target=x86_64-apple-darwin"
      -DCMAKE_CXX_FLAGS="--target=x86_64-apple-darwin"
      -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld"
      -DCMAKE_OSX_SYSROOT=$SYSROOT
      -DCMAKE_AR=/usr/bin/llvm-ar
      -DCMAKE_RANLIB=/usr/bin/llvm-ranlib
    - cmake --build build
    - mv build/luxon_server build/luxon_server.macosx-sdk.rel+debinfo.darwin-x86_64

# RelWithDebInfo build x86 (32-bit) for Windows Vista via GCC MinGW-w64
build:mingw:vista_x86:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y cmake ninja-build git g++-mingw-w64-i686 g++
  script:
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_SYSTEM_NAME=Windows
      -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-posix
      -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0600 -DWINVER=0x0600"
      -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-posix
      -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0600 -DWINVER=0x0600"
      -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--subsystem,console:6.00"
      -DLUXON_USE_EMBED_RESOURCE=ON
      -DLUXON_SERVER_USE_SANMAKE=OFF
      -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    - cmake --build build
    - mv build/luxon_server.exe build/luxon_server.mingw-vista.rel+debinfo.exe

# RelWithDebInfo build wasm32 via wasi-sdk 33 (Preview 1)
build:wasip1:wasm32:
  extends: .build_template
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y cmake ninja-build git wget tar gcc g++
    - wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
    - tar -xzf wasi-sdk-33.0-x86_64-linux.tar.gz -C /opt
  script:
    - export WASI_SDK_PREFIX=/opt/wasi-sdk-33.0-x86_64-linux
    - >
      cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DCMAKE_TOOLCHAIN_FILE=$WASI_SDK_PREFIX/share/cmake/wasi-sdk-p1.cmake
    - cmake --build build
    - mv build/luxon_server build/luxon_server.wasi-sdk.rel+debinfo.wasm

# Release build Java via OpenJDK 21
package:java_wasm:
  extends: .build_template
  image: debian:trixie
  needs:
    - build:wasip1:wasm32
  before_script:
    - apt-get update && apt-get install -y openjdk-21-jdk-headless maven llvm
  script:
    - cp build/luxon_server.wasi-sdk.rel+debinfo.wasm WASMImpl/Java/src/main/luxon_server.wasm
    - llvm-strip WASMImpl/Java/src/main/luxon_server.wasm
    - cd WASMImpl/Java
    - mvn clean package
    - cp target/luxon-server-1.0.0-SNAPSHOT.jar ../../build/luxon_server.java-17.release.jar
  artifacts:
    paths:
      - build/luxon_server.java-17.release.jar
    expire_in: 1 week

# RelWithDebInfo build MS-DOS (i586) via Watt-32/DJGPP
build:djgpp:msdos:
  extends: .build_template
  image: debian:trixie
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  needs:
    - build:wasip1:wasm32
  before_script:
    - apt-get update && apt-get install -y build-essential wget bzip2 git nasm libfl2 llvm
    - wget -q https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2 -O /tmp/djgpp.tar.bz2
    - mkdir -p /opt && tar -xf /tmp/djgpp.tar.bz2 -C /opt
    - export PATH=/opt/djgpp/bin:$PATH
    - git clone https://github.com/gvanem/Watt-32.git /tmp/Watt-32
    - cd /tmp/Watt-32/src
    - ./configur.sh djgpp
    - wget -q https://github.com/jwt27/build-gcc/raw/refs/heads/master/patch/watt32-djgpp-205/djgpp.err -O ../inc/sys/djgpp.err
    - mkdir -p build/djgpp/
    - wget -q https://github.com/jwt27/build-gcc/raw/refs/heads/master/patch/watt32-djgpp-205/syserr.c -O build/djgpp/syserr.c
    - make -f djgpp.mak -j$(nproc)
    - mkdir -p /opt/djgpp/i586-pc-msdosdjgpp/include/watt32
    - cp -r ../inc/* /opt/djgpp/i586-pc-msdosdjgpp/include/watt32/
    - cp ../lib/libwatt.a /opt/djgpp/i586-pc-msdosdjgpp/lib/
    - cd $CI_PROJECT_DIR
    - wget -q https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz
    - tar -xzf wabt-1.0.41-linux-x64.tar.gz -C /opt
  script:
    - export PATH=/opt/djgpp/bin:/opt/wabt-1.0.41/bin:$PATH
    - cp build/luxon_server.wasi-sdk.rel+debinfo.wasm WASMImpl/C/luxon_server.wasm
    - cd WASMImpl/C
    - llvm-strip luxon_server.wasm
    - make -f Makefile.djgpp -j$(nproc)
    - mv luxon_server.exe ../../build/luxon_server.djgpp.release.exe

# RelWithDebInfo build amd64 via MSVC
build:msvc:amd64:
  extends: .build_template
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - cmake -B build -G "Visual Studio 17 2022" -A x64 -DMBEDTLS_FATAL_WARNINGS=OFF
    - cmake --build build --config RelWithDebInfo
    - cmake -E rename build/RelWithDebInfo/luxon_server.exe build/luxon_server.msvc.release.exe
    - cmake -E rename build/RelWithDebInfo/luxon_server.pdb build/luxon_server.msvc.release.pdb

# Strips each generated rel+debinfo binary to generate release binary
strip_binaries:
  stage: strip
  image: debian:trixie
  before_script:
    - apt-get update && apt-get install -y llvm xz-utils
  script:
    - rm -rf build/*.vcxproj* build/*.dir
    - |
      for file in build/*rel+debinfo*; do
        if [ -f "$file" ]; then
          release_file=$(echo "$file" | sed 's/rel+debinfo/release/')

          cp "$file" "$release_file"

          echo "Stripping $release_file..."
          llvm-strip "$release_file" || true
          
          echo "Compressing $file to .xz..."
          xz -z "$file"
        fi
      done
  artifacts:
    paths:
      - build/luxon_server*
    expire_in: 1 week

# Publish Debian packages via pages
pages:
  stage: publish
  image: debian:trixie
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update
    - apt-get install -y dpkg-dev apt-utils
  script:
    - mkdir -p public/debian

    # Gather generated .deb packages from matrix builds
    - find debian-packages -type f -name '*.deb' -exec cp {} public/debian/ \;

    # Build repository indices
    - cd public/debian
    - dpkg-scanpackages -m . /dev/null > Packages
    - gzip -k -9 Packages
    - apt-ftparchive release . > Release

  artifacts:
    paths:
      - public
